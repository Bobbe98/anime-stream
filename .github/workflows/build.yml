name: Build APK

# Compila l'app a ogni push e la pubblica nella pagina "Releases",
# pronta da scaricare e installare sul telefono.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dipendenze
        run: flutter pub get

      - name: Analisi del codice
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Compila APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Rinomina APK
        run: cp build/app/outputs/flutter-apk/app-release.apk AniWave-build-${{ github.run_number }}.apk

      - name: Salva APK tra gli artefatti
        uses: actions/upload-artifact@v4
        with:
          name: AniWave-apk
          path: AniWave-build-${{ github.run_number }}.apk

      - name: Pubblica nella pagina Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AniWave build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            APK compilato automaticamente dal branch `${{ github.ref_name }}` (commit ${{ github.sha }}).
            Scaricalo dal telefono e installalo (consenti "installa app sconosciute").
          files: AniWave-build-${{ github.run_number }}.apk

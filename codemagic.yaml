workflows:
  android-apk:
    name: AniWave Android APK
    max_build_duration: 60
    environment:
      flutter: stable
    cache:
      cache_paths:
        - $HOME/.pub-cache
    triggering:
      events:
        - push
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Test
        script: flutter test
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - robertovaleo@gmail.com
        notify:
          success: true
          failure: true
